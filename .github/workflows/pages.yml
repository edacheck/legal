name: Legal Pages

on:
  push:
    branches: [dev, main, 'feat/**', 'bug/**', 'chore/**', 'release/**']
  pull_request:
    branches: [dev, main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install document verification prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils fonts-dejavu-core
      - name: Install pinned Pandoc and Typst
        run: |
          make bootstrap
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - name: Restore previous immutable public snapshot
        run: python3 tools/site_ci.py restore
      - name: Validate sources and run regressions
        run: |
          actionlint
          make lint test
      - name: Package complete verified website
        run: make ci-package
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _build/publish
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legal-snapshot
          path: _build/site.tar.gz
          retention-days: 7

  snapshot:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: legal-snapshot
          path: snapshot
      - name: Preserve public snapshot before deploying
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/snapshot.py archive

  deploy:
    needs: [verify, snapshot]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Reject stale workflow reruns immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/snapshot.py current
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
